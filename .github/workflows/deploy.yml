name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            ROOT="$(git rev-parse --show-toplevel)"
            git -C "$ROOT" pull --ff-only
            test -f "$ROOT/frontend/Dockerfile"
            mkdir -p certbot/www
            docker compose up -d --build
            certbot certonly --webroot --non-interactive --keep-until-expiring --expand \
              --cert-name api.minhhieudev.id.vn \
              -w "$ROOT/backend/RoleManagement.Api/certbot/www" \
              -d api.minhhieudev.id.vn \
              -d admin.minhhieudev.id.vn \
              --email hieugm22@gmail.com \
              --agree-tos \
              --no-eff-email \
              || test -f /etc/letsencrypt/live/api.minhhieudev.id.vn/fullchain.pem
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            docker compose ps
