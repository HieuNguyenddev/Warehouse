name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telegram — bắt đầu deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_WEBSITE_URL: https://admin.minhhieudev.id.vn
        run: bash scripts/notify-telegram.sh start

      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            DEPLOY="${{ secrets.DEPLOY_PATH }}"
            if [ ! -d "$DEPLOY" ]; then
              DEPLOY="${DEPLOY%/RoleManagement.Api}"
            fi
            cd "$DEPLOY"
            ROOT="$(git rev-parse --show-toplevel)"
            git -C "$ROOT" pull --ff-only
            cd "$ROOT/backend"
            test -f "$ROOT/frontend/Dockerfile"
            test -f docker-compose.yml
            test -f .env || { echo "Thiếu $ROOT/backend/.env. Tạo file với POSTGRES_PASSWORD, JWT_KEY và SEED_PASSWORD trước khi deploy."; exit 1; }
            grep -q '^POSTGRES_PASSWORD=.' .env || { echo "Thiếu POSTGRES_PASSWORD trong $ROOT/backend/.env"; exit 1; }
            grep -q '^JWT_KEY=.' .env || { echo "Thiếu JWT_KEY trong $ROOT/backend/.env"; exit 1; }
            grep -q '^SEED_PASSWORD=.' .env || { echo "Thiếu SEED_PASSWORD trong $ROOT/backend/.env"; exit 1; }
            password="$(grep -E '^POSTGRES_PASSWORD=' .env | tail -n 1 | cut -d= -f2-)"
            connection="Host=postgres;Port=5432;Database=RoleManagementDb;Username=postgres;Password=${password}"
            current="$(grep -E '^CONNECTION_STRING=' .env | tail -n 1 | cut -d= -f2- || true)"
            if [ "$current" != "$connection" ]; then
              grep -v '^CONNECTION_STRING=' .env > .env.tmp
              printf '%s\n' "CONNECTION_STRING=${connection}" >> .env.tmp
              mv .env.tmp .env
              chmod 600 .env
              echo "Đã ghi CONNECTION_STRING với Host=postgres cho container API."
            fi
            bash "$ROOT/scripts/ensure-garage.sh"
            if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nginx; then
              echo "Phát hiện Nginx trên host đang chạy. Dừng và tắt systemd Nginx để nhường cổng 80/443 cho Docker Compose Nginx..."
              sudo systemctl disable --now nginx || true
            fi
            mkdir -p certbot/www
            sudo mkdir -p /etc/letsencrypt/live/api.minhhieudev.id.vn
            if [ ! -f /etc/letsencrypt/live/api.minhhieudev.id.vn/fullchain.pem ]; then
              echo "Tạo chứng chỉ tạm thời để Nginx container có thể khởi động..."
              sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout /etc/letsencrypt/live/api.minhhieudev.id.vn/privkey.pem \
                -out /etc/letsencrypt/live/api.minhhieudev.id.vn/fullchain.pem \
                -subj "/CN=api.minhhieudev.id.vn"
            fi
            docker compose up -d --build
            docker compose up -d --force-recreate --no-deps nginx
            sudo certbot certonly --webroot --non-interactive --keep-until-expiring --expand \
              --cert-name api.minhhieudev.id.vn \
              -w "$ROOT/backend/certbot/www" \
              -d api.minhhieudev.id.vn \
              -d admin.minhhieudev.id.vn \
              --email hieugm22@gmail.com \
              --agree-tos \
              --no-eff-email \
              || test -f /etc/letsencrypt/live/api.minhhieudev.id.vn/fullchain.pem
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            docker compose ps

      - name: Telegram — deploy thành công
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_WEBSITE_URL: https://admin.minhhieudev.id.vn
        run: bash scripts/notify-telegram.sh success

      - name: Telegram — deploy thất bại
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_ERROR: Bước deploy trên VPS thất bại. Log ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/notify-telegram.sh failure
