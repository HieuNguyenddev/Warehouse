name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            DEPLOY="${{ secrets.DEPLOY_PATH }}"
            if [ ! -d "$DEPLOY" ]; then
              DEPLOY="${DEPLOY%/RoleManagement.Api}"
            fi
            cd "$DEPLOY"
            ROOT="$(git rev-parse --show-toplevel)"
            git -C "$ROOT" pull --ff-only
            cd "$ROOT/backend"
            test -f "$ROOT/frontend/Dockerfile"
            test -f docker-compose.yml
            test -f .env || { echo "Thiếu $ROOT/backend/.env. Tạo file với POSTGRES_PASSWORD, JWT_KEY và SEED_PASSWORD trước khi deploy."; exit 1; }
            grep -q '^POSTGRES_PASSWORD=.' .env || { echo "Thiếu POSTGRES_PASSWORD trong $ROOT/backend/.env"; exit 1; }
            grep -q '^JWT_KEY=.' .env || { echo "Thiếu JWT_KEY trong $ROOT/backend/.env"; exit 1; }
            grep -q '^SEED_PASSWORD=.' .env || { echo "Thiếu SEED_PASSWORD trong $ROOT/backend/.env"; exit 1; }
            mkdir -p certbot/www
            docker compose up -d --build
            docker compose up -d --force-recreate --no-deps nginx
            certbot certonly --webroot --non-interactive --keep-until-expiring --expand \
              --cert-name api.minhhieudev.id.vn \
              -w "$ROOT/backend/certbot/www" \
              -d api.minhhieudev.id.vn \
              -d admin.minhhieudev.id.vn \
              --email hieugm22@gmail.com \
              --agree-tos \
              --no-eff-email \
              || test -f /etc/letsencrypt/live/api.minhhieudev.id.vn/fullchain.pem
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            docker compose ps
