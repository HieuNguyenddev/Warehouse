upstream rolemanagement_api {
    server api:8080;
}

server {
    listen 80;
    server_name api.minhhieudev.id.vn;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.minhhieudev.id.vn;

    ssl_certificate /etc/letsencrypt/live/api.minhhieudev.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.minhhieudev.id.vn/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://rolemanagement_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    server_name minhhieudev.id.vn www.minhhieudev.id.vn _;

    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://rolemanagement_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
