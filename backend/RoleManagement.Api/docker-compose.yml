services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 768m
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/data/rolemanagement.db"
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
