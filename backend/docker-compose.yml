x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  api:
    <<: *service
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 192m
    memswap_limit: 192m
    oom_score_adj: -100
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${CONNECTION_STRING:?Đặt CONNECTION_STRING trong backend/.env}"
      Jwt__Key: ${JWT_KEY:?Đặt JWT_KEY trong backend/.env, ít nhất 32 ký tự}
      Seed__Username: ${SEED_USERNAME:-admin}
      Seed__Password: ${SEED_PASSWORD:?Đặt SEED_PASSWORD trong backend/.env}
      Garage__Endpoint: http://garage:3900
      Garage__AccessKey: ${GARAGE_ACCESS_KEY:?Đặt GARAGE_ACCESS_KEY trong backend/.env}
      Garage__SecretKey: ${GARAGE_SECRET_KEY:?Đặt GARAGE_SECRET_KEY trong backend/.env}
      Garage__Bucket: ${GARAGE_BUCKET:-warehouse}
      Garage__Region: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:-}
      Ollama__BaseUrl: ${OLLAMA_URL:-http://ollama:11434}
      Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      DOTNET_GCHeapHardLimit: "134217728"
      DOTNET_GCConserveMemory: "9"
      DOTNET_gcServer: "0"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    <<: *service
    build:
      context: ../frontend
      dockerfile: Dockerfile
    mem_limit: 24m
    memswap_limit: 24m
    expose:
      - "80"

  nginx:
    <<: *service
    image: nginx:1.27-alpine
    mem_limit: 16m
    memswap_limit: 16m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend

  garage:
    <<: *service
    image: dxflrs/garage:v2.3.0
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: -200
    command: ["/garage", "-c", "/etc/garage.toml", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-warehouse}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?Đặt GARAGE_ACCESS_KEY trong backend/.env}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:?Đặt GARAGE_SECRET_KEY trong backend/.env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    <<: *service
    image: postgres:16-alpine
    mem_limit: 96m
    memswap_limit: 96m
    oom_score_adj: -400
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=64MB
      - -c
      - max_connections=12
      - -c
      - wal_buffers=1MB
      - -c
      - max_wal_size=64MB
      - -c
      - huge_pages=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: RoleManagementDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RoleManagementDb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama:
    <<: *service
    image: ollama/ollama:0.32.15
    mem_limit: 640m
    memswap_limit: 640m
    oom_score_adj: 300
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 60s
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_NUM_THREAD: "1"
      OLLAMA_CONTEXT_LENGTH: "1024"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  ollama-pull:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    image: ollama/ollama:0.32.15
    mem_limit: 48m
    memswap_limit: 48m
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama", "pull", "qwen2.5:0.5b"]
    restart: "no"

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  ollama-data:
