services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 512m
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${CONNECTION_STRING:?Đặt CONNECTION_STRING trong backend/.env}"
      Jwt__Key: ${JWT_KEY:?Đặt JWT_KEY trong backend/.env, ít nhất 32 ký tự}
      Seed__Username: ${SEED_USERNAME:-admin}
      Seed__Password: ${SEED_PASSWORD:?Đặt SEED_PASSWORD trong backend/.env}
      Garage__Endpoint: http://garage:3900
      Garage__AccessKey: ${GARAGE_ACCESS_KEY:?Đặt GARAGE_ACCESS_KEY trong backend/.env}
      Garage__SecretKey: ${GARAGE_SECRET_KEY:?Đặt GARAGE_SECRET_KEY trong backend/.env}
      Garage__Bucket: ${GARAGE_BUCKET:-warehouse}
      Garage__Region: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.minhhieudev.id.vn
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    mem_limit: 64m
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 32m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend

  garage:
    image: dxflrs/garage:v2.3.0
    mem_limit: 256m
    command: ["/garage", "-c", "/etc/garage.toml", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-warehouse}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?Đặt GARAGE_ACCESS_KEY trong backend/.env}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:?Đặt GARAGE_SECRET_KEY trong backend/.env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: RoleManagementDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RoleManagementDb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  garage-meta:
  garage-data:
